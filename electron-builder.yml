appId: com.awkbeats.prepstation
productName: AwkBeats Prep Station
copyright: Copyright © 2026 AwkBeats Prep Station
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - build/icon.png
  - build/logo.png
extraResources:
  - from: build/logo.png
    to: logo.png
asar: true
mac:
  category: public.app-category.music
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  title: AwkBeats Prep Station
  icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AwkBeats Prep Station
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: AwkBeats-Prep-Station-${version}-win-${arch}.${ext}
linux:
  icon: build/icons
artifactName: AwkBeats-Prep-Station-${version}-${os}-${arch}.${ext}
publish: null
